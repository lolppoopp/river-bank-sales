:root{
  --river-50:#EDF5F7;--river-100:#D5E7EC;--river-200:#A9CFD8;--river-300:#74AEBC;--river-400:#438C9F;
  --river-500:#2B7285;--river-600:#215B6B;--river-700:#1B4856;--river-800:#163945;--river-900:#0C2A31;
  --silt-100:#F3EBDC;--silt-300:#D8C397;--silt-500:#A8884F;--silt-700:#6E5830;
  --surface:#F5F7F7;--raised:#fff;--line:#DDE5E7;--line-strong:#C3D0D3;
  --ink:#0C2A31;--muted:#52666C;
  --ok:#2F7D5B;--ok-bg:#E4F2EB;--warn:#8F5A0E;--warn-bg:#F7ECD6;--danger:#A63A2A;--danger-bg:#F8E3DF;
  --sidebar:288px;
  --f-body:"Plex Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;
  --f-display:"Kufi Arabic","Plex Arabic",Tahoma,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-body);background:var(--surface);color:var(--ink);line-height:1.75;min-height:100dvh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.4}
button{font:inherit;cursor:pointer}
ul,ol{list-style:none;padding:0}
:focus-visible{outline:2px solid var(--river-500);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;inset-inline-start:12px;top:-60px;z-index:100;background:var(--river-700);color:#fff;padding:8px 16px;border-radius:8px;text-decoration:none}
.skip:focus{top:12px}

/* sidebar */
.sidebar{position:fixed;inset-block:0;inset-inline-start:0;width:var(--sidebar);background:var(--river-900);color:var(--river-100);display:flex;flex-direction:column;z-index:40;transition:transform .2s ease-out,visibility .2s}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px;padding:0 20px}
.brand-in{display:flex;align-items:center;gap:12px}
.brand b{display:block;font-family:var(--f-display);color:#fff;font-size:16px;line-height:1.3}
.brand small{display:block;color:var(--river-300);font-size:12px;line-height:1.3}
.nav{flex:1;overflow-y:auto;padding:16px 12px}
.nav ul{display:grid;gap:4px}
.nav hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:16px 0}
.nav a{position:relative;display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:8px;color:var(--river-100);text-decoration:none;font-size:14px;font-weight:500;transition:background .15s}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a[aria-current=page]{background:rgba(255,255,255,.1);color:#fff}
.nav a[aria-current=page]::before{content:"";position:absolute;inset-block:8px;inset-inline-start:0;width:4px;border-radius:99px;background:var(--silt-300)}
.nav svg{width:20px;height:20px;flex:none}
.side-foot{border-top:1px solid rgba(255,255,255,.1);padding:16px 20px;font-size:12px;color:var(--river-300)}
.close-btn{display:none}
.scrim{display:none}

/* main */
.wrap{padding-inline-start:var(--sidebar)}
.topbar{position:sticky;top:0;z-index:20;height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 32px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.menu-btn{display:none}
.icon-btn{width:40px;height:40px;border:0;background:transparent;border-radius:8px;color:var(--river-800);align-items:center;justify-content:center}
.icon-btn:hover{background:var(--river-50)}
.mini-brand{display:none;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--river-900)}
main{max-width:1280px;margin:0 auto;padding:32px}
main:focus{outline:none}
.stack>*+*{margin-top:24px}

/* ui */
.badge{display:inline-flex;align-items:center;white-space:nowrap;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:500;box-shadow:inset 0 0 0 1px var(--line);background:var(--river-50);color:var(--muted)}
.badge.river{background:var(--river-100);color:var(--river-800);box-shadow:inset 0 0 0 1px var(--river-200)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.danger{background:var(--danger-bg);color:var(--danger)}
.badge.sample{background:var(--silt-100);color:var(--silt-700);box-shadow:inset 0 0 0 1px var(--silt-300)}
.badge.big{padding:4px 12px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:8px;border:1px solid transparent;font-size:14px;font-weight:500;background:var(--river-700);color:#fff;transition:background .15s}
.btn:hover{background:var(--river-800)}
.btn.secondary{background:var(--raised);color:var(--river-800);border-color:var(--line-strong)}
.btn.secondary:hover{background:var(--river-50)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:disabled:hover{background:var(--river-700)}
.btn.secondary:disabled:hover{background:var(--raised)}
.card{background:var(--raised);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(12,42,49,.06)}
.card-h{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:16px;font-weight:600;color:var(--river-900)}
.card-h p{font-size:14px;color:var(--muted)}
.card-b{padding:20px}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.page-h .t{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.page-h h1{font-size:clamp(24px,3vw,30px);font-weight:700;color:var(--river-900)}
.page-h p.d{margin-top:4px;color:var(--muted);max-width:42rem}
.notice{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border:1px solid var(--silt-300);border-radius:10px;background:var(--silt-100);color:var(--silt-700);font-size:14px}
.notice svg{width:16px;height:16px;flex:none;margin-top:5px}

/* kpi strip */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden;background:var(--raised);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(12,42,49,.06)}
.kpi{padding:16px 20px}
.kpi+.kpi{border-inline-start:1px solid var(--line)}
.kpi dt{font-size:14px;color:var(--muted)}
.kpi dd.v{margin-top:4px;font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--river-900);line-height:1.4}
.kpi dd.h{font-size:12px;color:var(--muted)}

/* pipeline */
.flow{display:flex;gap:4px;height:64px}
.flow div{display:flex;align-items:center;justify-content:center;min-width:36px;font-family:var(--f-display);font-weight:700;font-size:14px}
.flow div:first-child{border-start-start-radius:99px;border-end-start-radius:99px}
.flow div:last-child{border-start-end-radius:99px;border-end-end-radius:99px}
.legend{display:grid;grid-template-columns:repeat(6,1fr);gap:8px 12px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.s0{background:var(--river-200);color:var(--river-900)}.s1{background:var(--river-300);color:var(--river-900)}
.s2{background:var(--river-400);color:#fff}.s3{background:var(--river-500);color:#fff}
.s4{background:var(--river-700);color:#fff}.s5{background:var(--river-900);color:#fff}

/* grid + tables */
.cols{display:grid;grid-template-columns:2fr 1fr;gap:24px}
.tbl{overflow-x:auto}
table{width:100%;min-width:34rem;border-collapse:collapse;font-size:14px}
th{background:var(--surface);color:var(--muted);font-weight:500;text-align:start;padding:10px 20px;border-bottom:1px solid var(--line)}
td{padding:12px 20px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td strong{font-weight:500;color:var(--river-900)}
.end{text-align:end}
.prog{display:flex;align-items:center;gap:12px}
.prog i{display:block;width:96px;height:6px;border-radius:99px;background:var(--river-50);overflow:hidden}
.prog i b{display:block;height:100%;background:var(--river-500);border-radius:99px}
.prog span{font-size:12px;color:var(--muted)}
.inv li+li{margin-top:20px}
.inv .r{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.inv .r b{font-weight:500;color:var(--river-900)}
.inv .r span,.inv p{font-size:12px;color:var(--muted)}
.inv .bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--river-50);margin-top:8px}
.inv p{margin-top:6px}

/* placeholders */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 24px}
.empty .ic{display:flex;width:48px;height:48px;border-radius:50%;background:var(--river-50);color:var(--river-600);align-items:center;justify-content:center}
.empty .ic svg{width:24px;height:24px}
.empty h3{margin-top:16px;font-size:16px;font-weight:600;color:var(--river-900)}
.empty p{margin-top:4px;max-width:28rem;font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.drop{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 24px;border:2px dashed var(--line-strong);border-radius:10px;background:var(--surface)}
.drop svg{width:32px;height:32px;color:var(--river-400)}
.drop b{margin-top:12px;font-size:14px;font-weight:500;color:var(--river-900)}
.drop p{margin:4px 0 20px;max-width:28rem;font-size:14px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.steps li{display:flex;gap:12px}
.steps .n{display:flex;flex:none;width:32px;height:32px;border-radius:50%;background:var(--river-100);color:var(--river-800);font-family:var(--f-display);font-weight:700;font-size:14px;align-items:center;justify-content:center}
.steps h3{font-size:14px;font-weight:600;color:var(--river-900)}
.steps p{font-size:14px;color:var(--muted)}

/* responsive */
@media (max-width:1279px){.cols{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}}
@media (max-width:1023px){
  .wrap{padding-inline-start:0}
  .topbar{padding:0 16px}
  main{padding:24px 16px}
  .menu-btn,.close-btn{display:flex}
  .mini-brand{display:flex}
  .sidebar{visibility:hidden;transform:translateX(100%)}
  .sidebar.open{visibility:visible;transform:none;box-shadow:0 0 40px rgba(12,42,49,.28)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(12,42,49,.5);z-index:30}
  .close-btn{color:var(--river-100)}
  .close-btn:hover{background:rgba(255,255,255,.1)}
}
@media (max-width:639px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi:nth-child(odd){border-inline-start:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .legend{grid-template-columns:repeat(3,1fr)}
  .steps{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
@media print{.sidebar,.topbar,.scrim{display:none!important}.wrap{padding:0}}
</style>
</head>
<body>
<a class="skip" href="#main">تخطَّ إلى المحتوى</a>
<div class="scrim" id="scrim"></div>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-in">
      <svg id="logo-side" width="36" height="36" viewBox="0 0 40 40" aria-hidden="true"></svg>
      <div><b>ريفر بنك</b><small>نظام إدارة المبيعات العقارية</small></div>
    </div>
    <button class="icon-btn close-btn" id="close" type="button" aria-label="إغلاق القائمة">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <nav class="nav" aria-label="التنقل الرئيسي" id="nav"></nav>
  <div class="side-foot"><p>الإصدار ٠٫١ — مرحلة التأسيس</p><p>لا يوجد تسجيل دخول أو قاعدة بيانات بعد.</p></div>
</aside>

<div class="wrap">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="icon-btn menu-btn" id="menu" type="button" aria-label="فتح القائمة" aria-expanded="false" aria-controls="sidebar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="mini-brand"><svg id="logo-top" width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"></svg>ريفر بنك</div>
    </div>
    <span class="badge warn">نسخة تطوير</span>
  </header>
  <main id="main" tabindex="-1"></main>
</div>

<script>
"use strict";
/* ============ ⚠️ بيانات تجريبية — مختلقة لعرض التصميم فقط، وليست بيانات الشركة ⚠️ ============ */
var SAMPLE_LABEL = "بيانات تجريبية";
var PIPELINE = [["جديد",46],["تم التواصل",31],["معاينة",22],["تفاوض",14],["حجز",8],["تعاقد",5]];
var KPIS = [
  ["العملاء النشطون","١٢٨","١٢ جديدًا هذا الأسبوع"],
  ["متابعات اليوم","١٤","منها متأخرة: ١"],
  ["وحدات متاحة","٢١٢","من إجمالي ٤٣٠ وحدة"],
  ["صفقات قيد التفاوض","١٤","حجوزات مؤكدة: ٨"]
];
var FOLLOWUPS = [
  ["عميل تجريبي ١","اتصال هاتفي","وكيل تجريبي أ","أمس","overdue"],
  ["عميل تجريبي ٢","واتساب","وكيل تجريبي ب","١٠:٣٠ ص","today"],
  ["عميل تجريبي ٣","معاينة وحدة","وكيل تجريبي أ","١٢:٠٠ م","today"],
  ["عميل تجريبي ٤","اجتماع بالمكتب","وكيل تجريبي ج","٣:٣٠ م","today"],
  ["عميل تجريبي ٥","اتصال هاتفي","وكيل تجريبي ب","غدًا","scheduled"]
];
var AGENTS = [["وكيل تجريبي أ",38,42,3],["وكيل تجريبي ب",29,40,2],["وكيل تجريبي ج",21,30,1]];
var INVENTORY = [["مشروع تجريبي أ",84,16,60],["مشروع تجريبي ب",52,9,39],["مشروع تجريبي ج",76,12,42]];
var STATUS = {overdue:["متأخرة","danger"],today:["اليوم","river"],scheduled:["مجدولة",""]};
/* ================================================================================================ */

var nf = new Intl.NumberFormat("ar-EG");
function n(v){ return nf.format(v); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

var ICONS = {
  dash:'<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  build:'<path d="M6 22V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v18zM6 12H4a1 1 0 0 0-1 1v9h3M18 9h2a1 1 0 0 1 1 1v12h-3M10 7h4M10 11h4M10 15h4"/>',
  agent:'<circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2M16 11l2 2 4-4"/>',
  sheet:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8M8 9h2"/>',
  flask:'<path d="M10 2v7.3L4.5 19a2 2 0 0 0 1.7 3h11.6a2 2 0 0 0 1.7-3L14 9.3V2M8.5 2h7M7 16h10"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  nf:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M9 9l4 4m0-4-4 4"/>'
};
function icon(name, size){
  size = size || 20;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[name]+'</svg>';
}
var LOGO = '<rect width="40" height="40" rx="10" fill="#215B6B"/>'+
  '<path d="M7 15c4.5-4 8.5 4 13 0s8.5 4 13 0" stroke="#F3EBDC" stroke-width="2.6" stroke-linecap="round" fill="none"/>'+
  '<path d="M7 22c4.5-4 8.5 4 13 0s8.5 4 13 0" stroke="#A9CFD8" stroke-width="2.6" stroke-linecap="round" fill="none"/>'+
  '<path d="M7 29c4.5-4 8.5 4 13 0s8.5 4 13 0" stroke="#74AEBC" stroke-width="2.6" stroke-linecap="round" fill="none"/>';
document.getElementById("logo-side").innerHTML = LOGO;
document.getElementById("logo-top").innerHTML = LOGO;

var NAV = [
  ["dashboard","لوحة التحكم","dash"],["customers","العملاء","users"],["properties","العقارات","home"],
  ["projects","المشاريع","build"],["agents","الوكلاء","agent"],["---"],["imports","استيراد Excel","sheet"]
];

function badge(text, tone, extra){ return '<span class="badge '+(tone||"")+' '+(extra||"")+'">'+esc(text)+'</span>'; }
function sampleBadge(){ return badge(SAMPLE_LABEL,"sample"); }
function pageHeader(title, desc, meta){
  return '<div class="page-h"><div><div class="t"><h1>'+esc(title)+'</h1>'+(meta||"")+'</div>'+
    (desc?'<p class="d">'+esc(desc)+'</p>':'')+'</div></div>';
}
function cardHead(title, desc, action){
  return '<header class="card-h"><div><h2>'+esc(title)+'</h2>'+(desc?'<p>'+esc(desc)+'</p>':'')+'</div>'+(action||"")+'</header>';
}

/* ---------- dashboard ---------- */
function dashboard(){
  var date = new Intl.DateTimeFormat("ar-EG",{dateStyle:"full",timeZone:"Africa/Cairo"}).format(new Date());
  var total = PIPELINE.reduce(function(s,p){return s+p[1];},0);
  var flowLabel = "توزيع "+n(total)+" عميلًا على مراحل المبيعات: "+PIPELINE.map(function(p){return p[0]+" "+n(p[1]);}).join("، ");
  var flow = PIPELINE.map(function(p,i){return '<div class="s'+i+'" style="flex:'+p[1]+' 1 0"><span class="num">'+n(p[1])+'</span></div>';}).join("");
  var legend = PIPELINE.map(function(p,i){return '<li><span class="dot s'+i+'"></span>'+esc(p[0])+'</li>';}).join("");
  var kpis = KPIS.map(function(k){return '<div class="kpi"><dl><dt>'+esc(k[0])+'</dt><dd class="v num">'+k[1]+'</dd><dd class="h">'+esc(k[2])+'</dd></dl></div>';}).join("");
  var fu = FOLLOWUPS.map(function(f){var s=STATUS[f[4]];return '<tr><td><strong>'+esc(f[0])+'</strong></td><td>'+esc(f[1])+'</td><td>'+esc(f[2])+'</td><td class="num">'+esc(f[3])+'</td><td>'+badge(s[0],s[1])+'</td></tr>';}).join("");
  var inv = INVENTORY.map(function(p){
    var t=p[1]+p[2]+p[3];
    var label=p[0]+": متاحة "+n(p[1])+"، محجوزة "+n(p[2])+"، مباعة "+n(p[3]);
    return '<li><div class="r"><b>'+esc(p[0])+'</b><span class="num">'+n(t)+' وحدة</span></div>'+
      '<div class="bar" role="img" aria-label="'+esc(label)+'"><span style="width:'+(p[3]/t*100)+'%;background:var(--river-800)"></span><span style="width:'+(p[2]/t*100)+'%;background:var(--silt-500)"></span><span style="width:'+(p[1]/t*100)+'%;background:var(--river-300)"></span></div>'+
      '<p class="num">متاحة '+n(p[1])+' • محجوزة '+n(p[2])+' • مباعة '+n(p[3])+'</p></li>';}).join("");
  var ag = AGENTS.map(function(a){
    return '<tr><td><strong>'+esc(a[0])+'</strong></td><td><div class="prog"><i role="img" aria-label="'+n(a[1])+' من '+n(a[2])+'"><b style="width:'+(a[1]/a[2]*100)+'%"></b></i><span class="num">'+n(a[1])+'/'+n(a[2])+'</span></div></td><td class="end num">'+n(a[3])+'</td></tr>';}).join("");
  return '<div class="stack">'+
    pageHeader("لوحة التحكم", date, sampleBadge())+
    '<div class="notice" role="note">'+icon("flask",16)+'<p><strong>'+SAMPLE_LABEL+'.</strong> الأرقام والأسماء في هذه الصفحة مُختلقة لعرض التصميم فقط، وليست من بيانات الشركة. ستُستبدل ببيانات حقيقية بعد ربط قاعدة البيانات.</p></div>'+
    '<div class="kpis">'+kpis+'</div>'+
    '<section class="card">'+cardHead("مسار العملاء","توزيع العملاء النشطين على مراحل المبيعات",sampleBadge())+
      '<div class="card-b"><div class="flow" role="img" aria-label="'+esc(flowLabel)+'">'+flow+'</div><ul class="legend">'+legend+'</ul></div></section>'+
    '<div class="cols">'+
      '<section class="card">'+cardHead("المتابعات القادمة","الأقرب موعدًا أولًا",sampleBadge())+
        '<div class="tbl"><table><caption class="sr-only">المتابعات القادمة (بيانات تجريبية)</caption><thead><tr><th scope="col">العميل</th><th scope="col">نوع المتابعة</th><th scope="col">الوكيل</th><th scope="col">الموعد</th><th scope="col">الحالة</th></tr></thead><tbody>'+fu+'</tbody></table></div></section>'+
      '<section class="card">'+cardHead("حالة الوحدات","حسب المشروع",sampleBadge())+'<div class="card-b"><ul class="inv">'+inv+'</ul></div></section>'+
    '</div>'+
    '<section class="card">'+cardHead("أداء الوكلاء","الشهر الحالي",sampleBadge())+
      '<div class="tbl"><table><caption class="sr-only">أداء الوكلاء (بيانات تجريبية)</caption><thead><tr><th scope="col">الوكيل</th><th scope="col">المتابعات المنجزة</th><th scope="col" class="end">الصفقات</th></tr></thead><tbody>'+ag+'</tbody></table></div></section>'+
  '</div>';
}

/* ---------- placeholders ---------- */
function placeholder(o){
  var chips = o.fields.map(function(f){return badge(f,"river","big");}).join("");
  return '<div class="stack">'+
    '<div class="page-h"><div><div class="t"><h1>'+esc(o.title)+'</h1>'+badge("قيد الإعداد")+'</div><p class="d">'+esc(o.desc)+'</p></div>'+
      '<button class="btn" type="button" disabled title="يتوفر بعد ربط قاعدة البيانات">'+esc(o.add)+'</button></div>'+
    '<section class="card"><div class="empty"><span class="ic">'+icon(o.icon,24)+'</span><h3>'+esc(o.emptyT)+'</h3><p>'+esc(o.emptyD)+'</p></div></section>'+
    '<section class="card">'+cardHead(o.fieldsT,"الحقول المخطط لها في هذه الوحدة")+'<div class="card-b"><ul class="chips">'+o.fields.map(function(f){return '<li>'+badge(f,"river","big")+'</li>';}).join("")+'</ul></div></section>'+
  '</div>';
}
var PAGES = {
  dashboard:{title:"لوحة التحكم",render:dashboard},
  customers:{title:"العملاء",render:function(){return placeholder({title:"العملاء",desc:"سجل العملاء المحتملين والحاليين ومتابعاتهم.",icon:"users",emptyT:"لا يوجد عملاء بعد",emptyD:"ستظهر هنا قائمة العملاء بعد ربط قاعدة البيانات أو استيراد ملف Excel.",add:"إضافة عميل",fieldsT:"بيانات العميل",fields:["الاسم","رقم الهاتف","الوكيل المسؤول","مصدر العميل","مرحلة المبيعات","الميزانية","ملاحظات","سجل المتابعات"]});}},
  properties:{title:"العقارات",render:function(){return placeholder({title:"العقارات",desc:"مخزون الوحدات المتاحة والمحجوزة والمباعة.",icon:"home",emptyT:"لا توجد وحدات بعد",emptyD:"ستظهر هنا الوحدات وحالتها بعد ربط قاعدة البيانات أو استيراد ملف Excel.",add:"إضافة وحدة",fieldsT:"بيانات الوحدة",fields:["المشروع","رقم الوحدة","نوع الوحدة","المساحة","السعر","الحالة"]});}},
  projects:{title:"المشاريع",render:function(){return placeholder({title:"المشاريع",desc:"المشاريع العقارية التي تسوّقها الشركة.",icon:"build",emptyT:"لا توجد مشاريع بعد",emptyD:"ستظهر هنا المشاريع وملخص وحداتها بعد ربط قاعدة البيانات.",add:"إضافة مشروع",fieldsT:"بيانات المشروع",fields:["اسم المشروع","الموقع","المطوّر","عدد الوحدات","حالة المشروع"]});}},

/* ---------- shell + router ---------- */
var navEl = document.getElementById("nav");
navEl.innerHTML = "<ul>"+NAV.slice(0,5).map(navItem).join("")+"</ul><hr><ul>"+NAV.slice(6).map(navItem).join("")+"</ul>";
function navItem(it){ return '<li><a href="#/'+it[0]+'" data-key="'+it[0]+'">'+icon(it[2])+it[1]+'</a></li>'; }

var sidebar = document.getElementById("sidebar"), scrim = document.getElementById("scrim"), menuBtn = document.getElementById("menu");
function setDrawer(open){
  sidebar.classList.toggle("open",open); scrim.classList.toggle("open",open);
  menuBtn.setAttribute("aria-expanded",String(open));
  document.body.style.overflow = open ? "hidden" : "";
  if(open) document.getElementById("close").focus();
}
menuBtn.addEventListener("click",function(){setDrawer(true);});
document.getElementById("close").addEventListener("click",function(){setDrawer(false); menuBtn.focus();});
scrim.addEventListener("click",function(){setDrawer(false);});
document.addEventListener("keydown",function(e){ if(e.key==="Escape" && sidebar.classList.contains("open")){setDrawer(false); menuBtn.focus();} });

function route(){
  var key = (location.hash.replace(/^#\/?/,"") || "dashboard");
  var page = PAGES[key];
  var main = document.getElementById("main");
  if(!page){
    document.title = "الصفحة غير موجودة | ريفر بنك";
    main.innerHTML = '<section class="card"><div class="empty"><span class="ic">'+icon("nf",24)+'</span><h3>الصفحة غير موجودة</h3><p>الرابط الذي فتحته غير صحيح أو تم نقله.</p><p style="margin-top:20px"><a class="btn" href="#/dashboard" style="text-decoration:none">العودة إلى لوحة التحكم</a></p></div></section>';
  } else {
    document.title = (key==="dashboard" ? "" : page.title+" | ")+"ريفر بنك — نظام إدارة المبيعات العقارية";
    main.innerHTML = page.render();
  }
  Array.prototype.forEach.call(navEl.querySelectorAll("a"),function(a){
    if(a.getAttribute("data-key")===key) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  setDrawer(false);
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",function(){route(); document.getElementById("main").focus({preventScroll:true});});
route();
</script>
