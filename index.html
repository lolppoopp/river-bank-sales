<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c5a"><meta name="color-scheme" content="light dark"><meta name="apple-mobile-web-app-capable" content="yes"><title>SmartHire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
:root{--bg:#eceee9;--card:#fafaf7;--ink:#101c26;--mut:#5d6b73;--pri:#0f5c5a;--onp:#fff;--acc:#f2b705;--bd:#cfd4cc;--ok:#1f7a4d;--bad:#a63d2f;--mid:#b07f00;--in:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f171b;--card:#16222a;--ink:#e6ecea;--mut:#8fa0a6;--pri:#5fc4bd;--onp:#08201f;--bd:#2a3a41;--ok:#5fd394;--bad:#f08a7a;--mid:#f2b705;--in:#0f171b}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.7;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:720px;margin:0 auto;padding:0 18px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0 12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:22px;direction:ltr}.logo span{background:var(--acc);color:#101c26;padding:0 7px;border-radius:5px;margin-left:2px}
.who{display:flex;align-items:center;gap:10px}.who .nm{line-height:1.3}.who .m{line-height:1.3}
.av{width:36px;height:36px;border-radius:50%;background:var(--pri);color:var(--onp);display:grid;place-items:center;font-weight:700}
nav{display:flex;gap:2px;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);overflow-x:auto;margin:0 -18px;padding:0 14px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;color:var(--mut);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:700}
h1{font-size:26px;line-height:1.35;margin:20px 0 6px}h2{font-size:19px;margin:22px 0 4px}h3{font-size:17px;margin:0;line-height:1.5}
p{margin:6px 0}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--ink);font:inherit}
textarea{min-height:92px;resize:vertical}
.fl{display:block;font-weight:500;margin:14px 0 4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;background:var(--pri);color:var(--onp);border:1px solid var(--pri);border-radius:8px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn.g{background:none;color:var(--ink);border-color:var(--ink)}
.btn.s{min-height:38px;padding:4px 14px;font-size:14px}
.btn:disabled,.btn.ld{opacity:.55;pointer-events:none}
.btn.arm{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.btn.wide{width:100%;margin-top:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);border-radius:10px;overflow:hidden;margin:18px 0 4px}
.seg button{background:none;border:0;padding:11px;font:inherit;font-weight:500;color:var(--ink);cursor:pointer}
.seg button[aria-selected=true]{background:var(--ink);color:var(--bg);font-weight:700}
.rcs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.rc{position:relative;display:block}.rc input{position:absolute;opacity:0;inset:0;min-height:0}
.rc span{display:block;height:100%;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:var(--card);cursor:pointer}
.rc b{display:block}.rc small{color:var(--mut);font-size:13px;line-height:1.5;display:block}
.rc input:checked+span{border-color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri)}
.rc input:focus-visible+span{outline:3px solid var(--acc)}
.it{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.m{color:var(--mut);font-size:14px}.nm{font-weight:700}.ok{color:var(--ok)}.bad{color:var(--bad)}
.ds{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:8px 0}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{border:1px solid var(--bd);border-radius:99px;padding:1px 11px;font-size:14px}
.tag.y{background:var(--pri);border-color:var(--pri);color:var(--onp)}
.tag.n{border-style:dashed;color:var(--mut)}
.ck{position:relative}.ck input{position:absolute;opacity:0;inset:0;min-height:0;width:100%;cursor:pointer}
.ck span{display:inline-block;border:1px solid var(--bd);border-radius:99px;padding:6px 15px;background:var(--card)}
.ck input:checked+span{background:var(--pri);border-color:var(--pri);color:var(--onp);font-weight:700}
.ck input:checked+span::before{content:"\2713\00a0"}
.ck input:focus-visible+span{outline:3px solid var(--acc)}
.mt{display:flex;align-items:center;gap:8px;min-width:112px}
.mt i{flex:1;height:8px;border-radius:99px;background:var(--bd);overflow:hidden}
.mt b{display:block;height:100%;border-radius:99px;background:var(--ok)}
.mt.mid b{background:var(--mid)}.mt.lo b{background:var(--bad)}
.mt span{font-weight:700;font-size:14px;min-width:38px;text-align:left;font-variant-numeric:tabular-nums}
.st{display:inline-block;border-radius:99px;padding:0 11px;font-size:13px;font-weight:700;border:1px solid var(--bd);color:var(--mut);white-space:nowrap}
.st.a{border-color:var(--mid);color:var(--mid)}.st.g{border-color:var(--ok);color:var(--ok)}.st.r{border-color:var(--bad);color:var(--bad)}
.f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.f>input,.f>select{flex:1;min-width:120px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--bd)}
.row:first-of-type{margin-top:8px}
.nt{background:color-mix(in srgb,var(--acc) 16%,transparent);border-radius:10px;padding:12px 14px;margin:12px 0}
.em{padding:28px 8px;text-align:center;color:var(--mut)}
.sr{margin-top:12px}
details.bk{margin-top:10px}details.bk summary{list-style:none;cursor:pointer}details.bk summary::-webkit-details-marker{display:none}
.sk{height:104px;border-radius:12px;margin:12px 0;background:linear-gradient(90deg,var(--bd),transparent,var(--bd));background-size:200% 100%;opacity:.5;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}#toast{transition:none}}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:calc(100% - 36px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
@media (max-width:420px){.rcs{grid-template-columns:1fr}.hd{flex-direction:column;gap:6px}.mt{width:100%}}
</style>
</head>

function msg(e){var m=(e&&e.message)||String(e);for(var k in ERR)if(m.indexOf(k)>-1)return ERR[k];if(/Password should be/i.test(m))return 'كلمة المرور لازم تكون 6 أحرف على الأقل';if(/past/i.test(m))return 'اختر تاريخ من النهارده أو بعده';if(e&&e.code==='42501')return 'مش مسموح لك بالعملية دي';if(/fetch|network/i.test(m))return 'مشكلة في الاتصال بالإنترنت';return m}

function st(map,s){var x=map[s]||[s,''];return '<span class="st '+x[1]+'">'+esc(x[0])+'</span>'}
function meter(s){s=s||0;return '<div class="mt '+(s>=70?'':s>=40?'mid':'lo')+'" role="img" aria-label="نسبة التوافق '+s+' بالمئة"><i><b style="width:'+s+'%"></b></i><span>'+s+'%</span></div>'}
function col(a,k){return (a||[]).map(function(x){return x[k]})}
function chips(name,sel){return SKL.map(function(s){return '<label class="ck"><input type="checkbox" name="'+name+'" value="'+s.id+'"'+(sel&&sel.indexOf(s.id)>-1?' checked':'')+'><span>'+esc(s.name_ar)+'</span></label>'}).join('')}
function checked(){return [].slice.call(document.querySelectorAll('#main input:checked')).map(function(i){return +i.value})}

if(SUPABASE_URL.indexOf('PASTE')===0){$('app').innerHTML='<h1>خطوة أخيرة</h1><p>افتح الملف وعدّل أول سطر في الكود: ضع Project URL وanon key من Supabase (Project Settings ثم API).</p>'}
else{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);sb.auth.onAuthStateChange(function(e){if(e==='SIGNED_OUT'&&P){P=null;authUI()}});boot().catch(function(e){toast(msg(e));authUI()})}

async function boot(){

if(!s.data.session)return authUI();

SKL=(await sb.from('skills').select('*').order('id')).data||[];

function authUI(){

'<div class="seg" role="tablist"><button type="button" role="tab" id="t1" aria-selected="true">دخول</button><button type="button" role="tab" id="t2" aria-selected="false">حساب جديد</button></div>'+
'<form id="af" novalidate><div id="su" hidden><label class="fl" for="nm">الاسم</label><input id="nm" autocomplete="name"><div class="fl">أنت مين؟</div><div class="rcs">'+
RC.map(function(r,i){return '<label class="rc"><input type="radio" name="ro" value="'+r[0]+'"'+(i?'':' checked')+'><span><b>'+r[1]+'</b><small>'+r[2]+'</small></span></label>'}).join('')+'</div></div>'+
'<label class="fl" for="em">البريد الإلكتروني</label><input id="em" type="email" autocomplete="email" inputmode="email">'+
'<label class="fl" for="pw">كلمة المرور</label><input id="pw" type="password" autocomplete="current-password" placeholder="6 أحرف على الأقل">'+
'<button class="btn wide" id="sb" type="submit">دخول</button></form>';
function setMode(u){up=u;$('su').hidden=!u;$('t1').setAttribute('aria-selected',!u);$('t2').setAttribute('aria-selected',u);$('sb').textContent=u?'إنشاء الحساب':'دخول';$('pw').autocomplete=u?'new-password':'current-password'}
$('t1').onclick=function(){setMode(false)};$('t2').onclick=function(){setMode(true)};
$('af').onsubmit=async function(e){e.preventDefault();var b=$('sb');if(b.disabled)return;
 var mail=$('em').value.trim(),pw=$('pw').value;

 b.disabled=true;
 try{

 }catch(x){toast(msg(x))}finally{b.disabled=false}}}

function shell(){
var t=TABS[P.role]||[];
$('app').innerHTML='<div class="top"><div class="logo">Smart<span>Hire</span></div><div class="who"><div class="av" aria-hidden="true">'+esc((P.full_name||'?').trim().charAt(0))+'</div><div><div class="nm">'+esc(P.full_name)+'</div><div class="m">'+(ROLE[P.role]||'')+'</div></div><button class="btn s g" id="lo">خروج</button></div></div>'+

async function go(k){CUR=k;document.querySelectorAll('nav button').forEach(function(b){var on=b.getAttribute('data-t')===k;b.className=on?'on':'';if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});main(skel());

/* أي زر بـ data-a ينفّذ ACT[اسم]، ووجود data-c يطلب تأكيدًا بنقرة ثانية */
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 if(b.hasAttribute('data-c')&&!b.classList.contains('arm')){var old=b.textContent;b.classList.add('arm');b.textContent='تأكيد؟';setTimeout(function(){if(b.isConnected){b.classList.remove('arm');b.textContent=old}},3000);return}
 var f=ACT[b.getAttribute('data-a')];if(!f)return;b.classList.add('ld');
 once(function(){return f(b.getAttribute('data-x'),b.getAttribute('data-y'))}).then(function(){if(b.isConnected)b.classList.remove('ld')})});
document.addEventListener('change',function(e){var f=e.target.getAttribute&&e.target.getAttribute('data-f');if(f){FILT[f]=e.target.value;go(CUR)}});
document.addEventListener('input',function(e){if(!e.target.hasAttribute||!e.target.hasAttribute('data-q'))return;var q=e.target.value.trim().toLowerCase();document.querySelectorAll('#main .it').forEach(function(n){n.hidden=!!q&&n.textContent.toLowerCase().indexOf(q)<0})});
ACT.go=function(k){return go(k)};

ACT.saveSk=async function(){if(ok(await sb.rpc('save_my_skills',{ids:checked()})))toast('اتحفظت مهاراتك')};

VIEWS.ap=async function(){
var r=await sb.from('applications').select('id,status,match_score,jobs(title,companies(name))').eq('seeker_id',P.id).order('created_at',{ascending:false});if(!ok(r))return;
main((r.data||[]).length?r.data.map(function(a){var j=a.jobs||{};return '<article class="it"><div class="hd"><h3>'+esc(j.title)+'</h3>'+st(APST,a.status)+'</div><div class="m">'+esc((j.companies||{}).name)+'</div>'+meter(a.match_score)+(a.status==='submitted'?'<div class="f"><button class="btn s g" data-c data-a="delAp" data-x="'+esc(a.id)+'">سحب الطلب</button></div>':'')+'</article>'}).join(''):em('لسه ما قدمتش على وظايف.','<div class="f" style="justify-content:center"><button class="btn s" data-a="go" data-x="jobs">شوف الوظائف</button></div>'))};
ACT.delAp=async function(id){if(ok(await sb.from('applications').delete().eq('id',id)))await VIEWS.ap()};

/* ---------- صاحب عمل ---------- */
VIEWS.mj=async function(){
var r=await sb.from('jobs').select('id,title,status,companies!inner(owner_id),applications(id,status,match_score,profiles(full_name))').eq('companies.owner_id',P.id).order('created_at',{ascending:false});if(!ok(r))return;
main((r.data||[]).length?r.data.map(function(j){var A=(j.applications||[]).sort(function(a,b){return (b.match_score||0)-(a.match_score||0)}),op=j.status==='open';
 return '<article class="it"><div class="hd"><h3>'+esc(j.title)+'</h3><span class="st '+(op?'g':'')+'">'+(op?'مفتوحة':'مغلقة')+'</span></div><div class="m">'+A.length+' متقدم</div>'+
 (A.length?A.map(function(a){return '<div class="row"><div><div class="nm">'+esc((a.profiles||{}).full_name)+'</div>'+meter(a.match_score)+'</div><div class="f" style="margin:0">'+st(APST,a.status)+
 (a.status==='hired'?'':'<button class="btn s g" data-a="setAp" data-x="'+esc(a.id)+'" data-y="shortlisted">اختصار</button><button class="btn s" data-a="setAp" data-x="'+esc(a.id)+'" data-y="hired">قبول</button><button class="btn s g" data-c data-a="setAp" data-x="'+esc(a.id)+'" data-y="rejected">رفض</button>')+'</div></div>'}).join(''):'<p class="m">مفيش متقدمين لسه.</p>')+
 '<div class="f"><button class="btn s g" data-a="togJob" data-x="'+esc(j.id)+'" data-y="'+(op?'closed':'open')+'">'+(op?'إغلاق الوظيفة':'إعادة فتح')+'</button></div></article>'}).join(''):em('لسه ما نشرتش وظائف.','<div class="f" style="justify-content:center"><button class="btn s" data-a="go" data-x="nj">انشر أول وظيفة</button></div>'))};
ACT.setAp=async function(id,s){if(ok(await sb.from('applications').update({status:s}).eq('id',id)))await VIEWS.mj()};
ACT.togJob=async function(id,s){if(ok(await sb.from('jobs').update({status:s}).eq('id',id)))await VIEWS.mj()};

VIEWS.nj=async function(){
var c=await sb.from('companies').select('id,name').eq('owner_id',P.id).limit(1);CO=(c.data||[])[0]||null;
main('<h2>وظيفة جديدة</h2>'+(CO?'':'<label class="fl" for="cn">اسم شركتك</label><input id="cn">')+'<label class="fl" for="jt">المسمى الوظيفي</label><input id="jt"><label class="fl" for="jd">وصف الوظيفة</label><textarea id="jd"></textarea><label class="fl" for="jc">المدينة</label><input id="jc"><div class="fl">المهارات المطلوبة</div><div class="tg">'+chips('js')+'</div><button class="btn wide" data-a="pubJob">انشر الوظيفة</button>')};
ACT.pubJob=async function(){
var t=$('jt').value.trim();if(!t){toast('اكتب المسمى الوظيفي');return}
var id=CO&&CO.id;
if(!id){var n=$('cn').value.trim();if(!n){toast('اكتب اسم الشركة');return}var cr=await sb.from('companies').insert({owner_id:P.id,name:n}).select('id').single();if(!ok(cr))return;id=cr.data.id}
var j=await sb.from('jobs').insert({company_id:id,title:t,description:$('jd').value.trim(),city:$('jc').value.trim()}).select('id').single();if(!ok(j))return;
var ids=checked();
if(ids.length&&!ok(await sb.from('job_skills').insert(ids.map(function(s){return {job_id:j.data.id,skill_id:s}}))))return;
toast('اتنشرت الوظيفة');await go('mj')};

/* ---------- فني ---------- */
VIEWS.tp=async function(){
var r=await sb.from('tradesperson_profiles').select('*').eq('user_id',P.id).maybeSingle(),t=r.data||{};TPX=t.user_id?t:null;
main('<h2>ملفك الفني</h2>'+(t.user_id?'<p>'+(t.verified?'<span class="st g">موثّق</span>':'<span class="st a">بانتظار توثيق الإدارة</span>')+'</p>':'<p class="m">املا بياناتك عشان العملاء يلاقوك ويحجزوا معاك.</p>')+
'<label class="fl" for="ct">التخصص</label><select id="ct">'+CAT.map(function(c){return '<option value="'+c.id+'"'+(t.category_id===c.id?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select>'+
'<label class="fl" for="ci">المدينة</label><input id="ci" value="'+esc(t.city)+'">'+
'<label class="fl" for="pr">سعر الزيارة (جنيه)</label><input id="pr" type="number" inputmode="numeric" min="1" value="'+esc(t.price_per_visit)+'">'+
'<label class="fl" for="yr">سنوات الخبرة</label><input id="yr" type="number" inputmode="numeric" min="0" value="'+esc(t.years)+'">'+
'<label class="fl" for="bi">نبذة عنك</label><textarea id="bi">'+esc(t.bio)+'</textarea><button class="btn wide" data-a="saveTp">حفظ الملف</button>')};
ACT.saveTp=async function(){var p=+$('pr').value,c=$('ci').value.trim();if(!c||!(p>0)){toast('المدينة والسعر مطلوبين');return}
var d={user_id:P.id,category_id:+$('ct').value,city:c,price_per_visit:p,years:+$('yr').value||0,bio:$('bi').value.trim()};
var q=TPX?await sb.from('tradesperson_profiles').update(d).eq('user_id',P.id):await sb.from('tradesperson_profiles').insert(d);if(ok(q)){toast('اتحفظ ملفك');await VIEWS.tp()}};
VIEWS.tb=async function(){
var r=await sb.from('bookings').select('id,visit_date,slot,status,profiles(full_name)').eq('tradesperson_id',P.id).order('visit_date');if(!ok(r))return;var td=today();
main((r.data||[]).length?r.data.map(function(b){return '<article class="it"><div class="hd"><h3>'+esc((b.profiles||{}).full_name)+'</h3>'+st(BKST,b.status)+'</div><div class="m">'+esc(dt(b.visit_date))+' - '+SLOT[b.slot]+'</div><div class="f">'+
 (b.status==='pending'?'<button class="btn s" data-a="setBk" data-x="'+esc(b.id)+'" data-y="confirmed">تأكيد الحجز</button>':'')+
 (b.status==='confirmed'?(b.visit_date<=td?'<button class="btn s" data-a="setBk" data-x="'+esc(b.id)+'" data-y="done">تمت الزيارة</button>':'<span class="m">تقدر تأكد إتمام الزيارة يوم الموعد</span>'):'')+
 (b.status==='pending'||b.status==='confirmed'?'<button class="btn s g" data-c data-a="setBk" data-x="'+esc(b.id)+'" data-y="cancelled">إلغاء</button>':'')+'</div></article>'}).join(''):em('مفيش حجوزات لسه.'))};
ACT.setBk=async function(id,s){if(ok(await sb.from('bookings').update({status:s}).eq('id',id)))await go(P.role==='customer'?'cb':'tb')};

/* ---------- عميل ---------- */
VIEWS.tl=async function(){
var r=await Promise.all([sb.from('tradesperson_profiles').select('user_id,city,price_per_visit,years,bio,verified,profiles(full_name),service_categories(name)').limit(100),sb.from('tradesperson_rating').select('*')]);if(!ok(r[0]))return;
var rt={};(r[1].data||[]).forEach(function(x){rt[x.tradesperson_id]=x});
var td=today(),fc=FILT.c||'',fy=FILT.y||'',cities=[];(r[0].data||[]).forEach(function(t){if(cities.indexOf(t.city)<0)cities.push(t.city)});
var L=(r[0].data||[]).filter(function(t){return (!fc||(t.service_categories||{}).name===fc)&&(!fy||t.city===fy)});
main('<h2>فنيين متاحين</h2><div class="f"><select aria-label="التخصص" data-f="c"><option value="">كل التخصصات</option>'+CAT.map(function(c){return '<option'+(fc===c.name?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select><select aria-label="المدينة" data-f="y"><option value="">كل المدن</option>'+cities.map(function(c){return '<option'+(fy===c?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></div>'+
(L.length?L.map(function(t){var x=rt[t.user_id],id=esc(t.user_id);
 return '<article class="it"><div class="hd"><h3>'+esc((t.profiles||{}).full_name)+'</h3><div class="nm">'+t.price_per_visit+' جنيه <span class="m">/ زيارة</span></div></div><div class="tg"><span class="tag">'+esc((t.service_categories||{}).name)+'</span>'+(t.verified?'<span class="st g">موثّق</span>':'')+'</div><div class="m">'+esc(t.city)+'، خبرة '+t.years+' سنوات - '+(x?'★ '+x.avg_rating+' ('+x.reviews+' تقييم)':'لسه بدون تقييمات')+'</div><p class="ds">'+esc(t.bio)+'</p>'+
 '<details class="bk"><summary class="btn s">احجز موعد</summary><div class="f"><input type="date" min="'+td+'" id="d'+id+'" aria-label="يوم الزيارة"><select id="s'+id+'" aria-label="الفترة"><option value="morning">صباحًا</option><option value="noon">ظهرًا</option><option value="evening">مساءً</option></select><button class="btn s" data-a="book" data-x="'+id+'">تأكيد الحجز</button></div></details></article>'}).join(''):em('مفيش فنيين مطابقين.')))};
ACT.book=async function(id){var d=$('d'+id).value;if(!d){toast('اختر يوم الزيارة');return}
var r=await sb.from('bookings').insert({customer_id:P.id,tradesperson_id:id,visit_date:d,slot:$('s'+id).value});
if(r.error&&r.error.code==='23505'){toast('الموعد ده محجوز، اختر فترة تانية');return}if(ok(r)){toast('اتحجز الموعد');await go('cb')}};
VIEWS.cb=async function(){
var r=await sb.from('bookings').select('id,visit_date,slot,status,tradesperson_profiles(profiles(full_name),service_categories(name))').eq('customer_id',P.id).order('visit_date',{ascending:false});if(!ok(r))return;
var ids=col(r.data,'id'),rv={};
if(ids.length)((await sb.from('reviews').select('booking_id,rating').in('booking_id',ids)).data||[]).forEach(function(x){rv[x.booking_id]=x.rating});
main((r.data||[]).length?r.data.map(function(b){var t=b.tradesperson_profiles||{},bid=esc(b.id);return '<article class="it"><div class="hd"><h3>'+esc((t.profiles||{}).full_name)+' <span class="m">'+esc((t.service_categories||{}).name)+'</span></h3>'+st(BKST,b.status)+'</div><div class="m">'+esc(dt(b.visit_date))+' - '+SLOT[b.slot]+'</div><div class="f">'+
 (b.status==='pending'||b.status==='confirmed'?'<button class="btn s g" data-c data-a="setBk" data-x="'+bid+'" data-y="cancelled">إلغاء الحجز</button>':'')+
 (b.status==='done'?(rv[b.id]?'<span class="ok">تقييمك: '+rv[b.id]+' من 5</span>':'<span class="m">قيّم الزيارة:</span>'+[1,2,3,4,5].map(function(n){return '<button class="btn s g" data-a="rate" data-x="'+bid+'" data-y="'+n+'" aria-label="'+n+' من 5">'+n+' ★</button>'}).join('')):'')+'</div></article>'}).join(''):em('ما فيش حجوزات.','<div class="f" style="justify-content:center"><button class="btn s" data-a="go" data-x="tl">دوّر على فني</button></div>'))};
ACT.rate=async function(id,n){if(ok(await sb.from('reviews').insert({booking_id:id,rating:+n}))){toast('شكرًا لتقييمك');await VIEWS.cb()}};

/* ---------- الإدارة ---------- */
VIEWS.ad=async function(){
var r=await sb.from('tradesperson_profiles').select('user_id,city,price_per_visit,years,verified,profiles(full_name),service_categories(name)').order('verified');if(!ok(r))return;
var D=r.data||[],pend=D.filter(function(t){return !t.verified});
main('<h2>توثيق الفنيين</h2><p class="m">'+pend.length+' بانتظار التوثيق من '+D.length+' فني</p>'+(D.length?D.map(function(t){
 return '<article class="it"><div class="hd"><h3>'+esc((t.profiles||{}).full_name)+'</h3>'+(t.verified?'<span class="st g">موثّق</span>':'<span class="st a">بانتظار التوثيق</span>')+'</div><div class="m">'+esc((t.service_categories||{}).name)+' - '+esc(t.city)+' - خبرة '+t.years+' سنوات - '+t.price_per_visit+' جنيه</div><div class="f">'+
 (t.verified?'<button class="btn s g" data-c data-a="verify" data-x="'+esc(t.user_id)+'" data-y="0">إلغاء التوثيق</button>':'<button class="btn s" data-a="verify" data-x="'+esc(t.user_id)+'" data-y="1">توثيق</button>')+'</div></article>'}).join(''):em('مفيش فنيين مسجلين.')))};
ACT.verify=async function(id,v){if(ok(await sb.from('tradesperson_profiles').update({verified:v==='1'}).eq('user_id',id))){toast(v==='1'?'اتوثّق الفني':'اتلغى التوثيق');await VIEWS.ad()}};
</script>
